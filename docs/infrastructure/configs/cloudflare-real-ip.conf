# DESCRIPTIVE COPY — NOT AUTHORITATIVE
# ======================================
# This file is a reference copy of /etc/nginx/conf.d/cloudflare-real-ip.conf
# on the production VPS.
#
# The live file on the VPS is authoritative. If the two diverge, update
# this file to match production.
#
# Last synced: 2026-05-01 (Phase 3c — Cloudflare proxy enabled)
# See: docs/infrastructure/production_architecture.md
#      docs/infrastructure/cloudflare_setup.md
#
# PURPOSE
# -------
# When Cloudflare proxy (orange cloud) is enabled, nginx's $remote_addr is a
# Cloudflare edge IP (not the real client IP). Cloudflare sets the
# CF-Connecting-IP header to the real client IP on every proxied request.
#
# This file:
#  1. Declares all Cloudflare published IP ranges as trusted via set_real_ip_from.
#  2. Rewrites nginx's $remote_addr from the CF-Connecting-IP header using real_ip_header.
#
# After this rewrite, $remote_addr holds the real client IP. nginx then forwards
# this value to Tomcat in the X-Real-IP and X-Forwarded-For headers (set in the
# site config). Tomcat's RemoteIpValve reads X-Forwarded-For and completes the chain.
#
# MAINTENANCE
# -----------
# Cloudflare's IP ranges are stable but not immutable. Verify against the canonical
# sources periodically (especially after any Cloudflare infrastructure announcement):
#   IPv4: https://www.cloudflare.com/ips-v4
#   IPv6: https://www.cloudflare.com/ips-v6
#
# If ranges change and this file is not updated, nginx will not trust the new
# Cloudflare edge IPs and will log incorrect client IPs (Cloudflare edge IPs
# rather than real client IPs). This is a data quality issue, not a security issue.

# Cloudflare IPv4 ranges (source: https://www.cloudflare.com/ips-v4)
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

# Cloudflare IPv6 ranges (source: https://www.cloudflare.com/ips-v6)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Rewrite $remote_addr from the CF-Connecting-IP header (Cloudflare's real-client-IP header).
# After this directive, $remote_addr reflects the true client IP, and nginx forwards
# it correctly in X-Real-IP and X-Forwarded-For to Tomcat.
real_ip_header CF-Connecting-IP;

# Walk the X-Forwarded-For chain in case of multi-hop proxy scenarios.
# Required when there may be more than one trusted proxy in front of nginx
# (e.g. a TPA deploying behind their own corporate proxy in addition to Cloudflare).
real_ip_recursive on;
