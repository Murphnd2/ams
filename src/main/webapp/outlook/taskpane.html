<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log to AMS</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --ams-primary: #0d5681;
            --ams-accent:  #87a948;
            --ams-bg:      #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 12px;
            background: var(--ams-bg);
            color: #212529;
        }
        .ams-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--ams-primary);
            margin-bottom: 12px;
        }
        .ams-header .logo-dot {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: var(--ams-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
        }
        .ams-header h5 { margin: 0; color: var(--ams-primary); font-weight: 600; }
        .section { margin-bottom: 14px; }
        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .email-preview {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
        }
        .email-preview .field { margin-bottom: 3px; }
        .email-preview .label { color: #6c757d; display: inline-block; width: 58px; }
        .attachments-list { margin-top: 6px; }
        .attachments-list .att {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 3px 0;
        }
        .attachments-list .att input { margin: 0; }
        #activitySearch { font-size: 13px; }
        .suggestions {
            position: relative;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 6px 6px;
            background: #fff;
            display: none;
        }
        .suggestion-item {
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f5;
        }
        .suggestion-item:hover { background: #e9f3fb; }
        .suggestion-item:last-child { border-bottom: none; }
        .selected-activity {
            background: var(--ams-primary);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selected-activity .clear-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 4px;
        }
        .btn-ams {
            background: var(--ams-accent);
            border: none;
            color: #fff;
            font-weight: 600;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-ams:hover { background: #6f9139; color: #fff; }
        .btn-ams:disabled { background: #adb5bd; cursor: not-allowed; }
        .form-check-label { font-size: 12px; }
        .alert { font-size: 12px; padding: 8px 10px; }
        .hidden { display: none !important; }
        .spinner-sm {
            width: 14px; height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Tab navigation --- */
        .ams-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 14px;
            border-bottom: 2px solid #dee2e6;
        }
        .ams-tab {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 600;
            color: #6c757d;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .ams-tab:hover { color: var(--ams-primary); }
        .ams-tab.active {
            color: var(--ams-primary);
            border-bottom-color: var(--ams-primary);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* --- Custom reason toggle --- */
        #customReasonWrap { margin-top: 6px; }
        #ticketDescription { font-size: 13px; }
    </style>
</head>
<body>

<div class="ams-header">
    <div class="logo-dot">A</div>
    <h5>Log to AMS</h5>
</div>

<div id="loadingState" class="text-center text-muted py-4">
    <div class="spinner-border spinner-border-sm" role="status"></div>
    <div class="mt-2" style="font-size: 12px;">Connecting to AMS…</div>
</div>

<div id="notLinkedState" class="hidden">
    <div class="alert alert-warning">
        <strong>Account not linked.</strong><br>
        Your Microsoft 365 account is not linked to AMS. Please contact your administrator to set up access.
    </div>
    <div class="text-muted" style="font-size: 11px;">
        <span id="userEmailDisplay"></span>
    </div>
</div>

<div id="mainUi" class="hidden">

    <!-- Email preview (shared) -->
    <div class="section">
        <div class="section-label">Email</div>
        <div class="email-preview">
            <div class="field"><span class="label">From:</span> <span id="emailFrom"></span></div>
            <div class="field"><span class="label">Subject:</span> <span id="emailSubject"></span></div>
            <div class="field"><span class="label">Date:</span> <span id="emailDate"></span></div>
            <div id="attachmentsSection" class="hidden">
                <div class="label" style="margin-top: 6px;">Attachments:</div>
                <div class="attachments-list" id="attachmentsList"></div>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="ams-tabs">
        <button class="ams-tab active" data-tab="logTab">Log to Activity</button>
        <button class="ams-tab" data-tab="ticketTab">Create Ticket</button>
    </div>

    <!-- Tab 1: Log to Activity (existing) -->
    <div class="tab-pane active" id="logTab">
        <div class="section">
            <div class="section-label">Activity</div>
            <div id="activitySelector">
                <input type="text" class="form-control" id="activitySearch"
                       placeholder="Search by employer or activity…" autocomplete="off"/>
                <div class="suggestions" id="suggestions"></div>
            </div>
            <div id="selectedActivityBox" class="selected-activity hidden">
                <span id="selectedActivityLabel"></span>
                <button type="button" class="clear-btn" id="clearActivityBtn" title="Clear">&times;</button>
            </div>
        </div>

        <div class="section">
            <div class="section-label">Status after logging</div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="statusRadio" id="statusWaitOnUs" value="3" checked/>
                <label class="form-check-label" for="statusWaitOnUs">Waiting on Us</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="statusRadio" id="statusWaitOnThem" value="1"/>
                <label class="form-check-label" for="statusWaitOnThem">Waiting on Them</label>
            </div>
        </div>

        <button type="button" class="btn-ams" id="logBtn" disabled>Log Email</button>
        <div id="logResultAlert" class="alert hidden mt-2"></div>
    </div>

    <!-- Tab 2: Create Ticket -->
    <div class="tab-pane" id="ticketTab">
        <div class="section">
            <div class="section-label">Ticket Reason</div>
            <select class="form-select form-select-sm" id="serviceItemSelect">
                <option value="" disabled selected>Loading…</option>
            </select>
            <div id="customReasonWrap" class="hidden">
                <input type="text" class="form-control form-control-sm mt-1" id="customReasonInput"
                       placeholder="Describe the reason…" autocomplete="off"/>
            </div>
        </div>

        <div class="section">
            <div class="section-label">Description</div>
            <input type="text" class="form-control form-control-sm" id="ticketDescription"
                   placeholder="Ticket description (defaults to subject)"/>
        </div>

        <div class="section">
            <div class="section-label">Primary Contact</div>
            <select class="form-select form-select-sm" id="primaryContactSelect">
                <option value="" disabled selected>Loading…</option>
            </select>
        </div>

        <div class="section" id="additionalContactsSection" style="display:none;">
            <div class="section-label">Additional Contacts</div>
            <div id="additionalContactsList"></div>
        </div>

        <button type="button" class="btn-ams" id="createTicketBtn" disabled>Create Ticket</button>
        <div id="ticketResultAlert" class="alert hidden mt-2"></div>
    </div>

    <div class="text-muted mt-3" style="font-size: 10px;">
        Signed in as <span id="signedInAs"></span>
    </div>
</div>

<script>
(function () {
    'use strict';

    var API_BASE = 'https://superiorstate.biz';
    var TOKEN_KEY = 'ams_outlook_token';
    var STORED_EMAIL_KEY = 'ams_outlook_email';

    var state = {
        token: null,
        userName: null,
        personId: null,
        mailboxEmail: null,
        selectedActivity: null,
        emailBodyText: '',
        attachmentMeta: [],  // [{id, name, size, selected}]
        ticketCategories: [], // [{id, description, categoryId, category}]
        emailPeople: []      // [{email, name, label}] — all people on the email minus logged-in user
    };

    // --- Office.js bootstrap ---
    Office.onReady(function (info) {
        if (info.host !== Office.HostType.Outlook) {
            showError('This add-in only works in Outlook.');
            return;
        }
        try {
            state.mailboxEmail = Office.context.mailbox.userProfile.emailAddress;
            authenticate();
        } catch (e) {
            showError('Unable to read Outlook profile: ' + e.message);
        }
    });

    // --- Authentication flow ---
    function authenticate() {
        var storedToken = localStorage.getItem(TOKEN_KEY);
        var storedEmail = localStorage.getItem(STORED_EMAIL_KEY);

        if (storedToken && storedEmail === state.mailboxEmail) {
            state.token = storedToken;
            validateStoredToken(function (ok) {
                if (ok) {
                    exchangeEmailForToken();
                } else {
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem(STORED_EMAIL_KEY);
                    state.token = null;
                    exchangeEmailForToken();
                }
            });
        } else {
            exchangeEmailForToken();
        }
    }

    function validateStoredToken(cb) {
        fetch(API_BASE + '/api/v1/outlook/activities?q=__ping__', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + state.token }
        }).then(function (res) {
            cb(res.status !== 401);
        }).catch(function () {
            cb(false);
        });
    }

    function exchangeEmailForToken() {
        fetch(API_BASE + '/api/v1/outlook/authenticate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ m365Email: state.mailboxEmail })
        }).then(function (res) {
            if (res.status === 404) {
                showNotLinked();
                return null;
            }
            if (!res.ok) {
                throw new Error('Authentication failed (' + res.status + ')');
            }
            return res.json();
        }).then(function (data) {
            if (!data) return;
            state.token = data.token;
            state.userName = data.userName;
            state.personId = data.personId;
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(STORED_EMAIL_KEY, state.mailboxEmail);
            showMainUi();
        }).catch(function (err) {
            showError(err.message);
        });
    }

    // --- UI state transitions ---
    function showNotLinked() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('notLinkedState').classList.remove('hidden');
        document.getElementById('userEmailDisplay').textContent = state.mailboxEmail;
    }

    function showError(msg) {
        document.getElementById('loadingState').innerHTML =
            '<div class="alert alert-danger">' + escapeHtml(msg) + '</div>';
    }

    function showMainUi() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('mainUi').classList.remove('hidden');
        document.getElementById('signedInAs').textContent = state.userName || state.mailboxEmail;
        populateEmailPreview();
        wireTabs();
        wireActivitySearch();
        wireLogButton();
        wireTicketForm();
    }

    // --- Tabs ---
    function wireTabs() {
        var tabs = document.querySelectorAll('.ams-tab');
        tabs.forEach(function (tab) {
            tab.addEventListener('click', function () {
                tabs.forEach(function (t) { t.classList.remove('active'); });
                tab.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });
    }

    // --- Email preview ---
    function populateEmailPreview() {
        var item = Office.context.mailbox.item;
        if (!item) return;

        var fromName = item.from ? (item.from.displayName || '') : '';
        var fromEmail = item.from ? (item.from.emailAddress || '') : '';
        document.getElementById('emailFrom').textContent =
            fromName + (fromEmail ? ' <' + fromEmail + '>' : '');
        document.getElementById('emailSubject').textContent = item.subject || '(no subject)';
        document.getElementById('emailDate').textContent =
            item.dateTimeCreated ? new Date(item.dateTimeCreated).toLocaleString() : '';

        // Default the ticket description to the email subject
        document.getElementById('ticketDescription').value = item.subject || '';

        // Build people list for ticket contact selection (From + To + CC, minus logged-in user)
        var userEmail = (state.mailboxEmail || '').toLowerCase();
        var seen = {};
        state.emailPeople = [];

        function addPerson(email, name, isFrom) {
            var key = (email || name || '').toLowerCase();
            if (!key || key === userEmail || seen[key]) return;
            seen[key] = true;
            var label = name || email;
            if (name && email) label = name + ' <' + email + '>';
            state.emailPeople.push({ email: email || '', name: name || '', label: label, isFrom: isFrom });
        }

        // From first (so it's default)
        if (item.from) addPerson(item.from.emailAddress, item.from.displayName, true);
        (item.to || []).forEach(function (r) { addPerson(r.emailAddress, r.displayName, false); });
        (item.cc || []).forEach(function (r) { addPerson(r.emailAddress, r.displayName, false); });

        // Attachments
        var atts = item.attachments || [];
        state.attachmentMeta = [];
        if (atts.length > 0) {
            var listEl = document.getElementById('attachmentsList');
            listEl.innerHTML = '';
            atts.forEach(function (att, idx) {
                if (att.isInline) return;
                state.attachmentMeta.push({
                    id: att.id,
                    name: att.name,
                    size: att.size,
                    selected: true
                });
                var row = document.createElement('div');
                row.className = 'att';
                var cbId = 'att_' + idx;
                row.innerHTML = '<input type="checkbox" id="' + cbId + '" checked data-idx="' +
                    (state.attachmentMeta.length - 1) + '"/> ' +
                    '<label for="' + cbId + '" style="cursor:pointer;">' +
                    escapeHtml(att.name) + ' <span class="text-muted">(' +
                    formatBytes(att.size) + ')</span></label>';
                listEl.appendChild(row);
            });
            if (state.attachmentMeta.length > 0) {
                document.getElementById('attachmentsSection').classList.remove('hidden');
                listEl.addEventListener('change', function (e) {
                    if (e.target && e.target.dataset && e.target.dataset.idx) {
                        var i = parseInt(e.target.dataset.idx, 10);
                        state.attachmentMeta[i].selected = e.target.checked;
                    }
                });
            }
        }

        // Body (async)
        item.body.getAsync(Office.CoercionType.Text, function (result) {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
                state.emailBodyText = result.value || '';
            }
        });
    }

    // --- Activity autocomplete (Tab 1) ---
    function wireActivitySearch() {
        var input = document.getElementById('activitySearch');
        var suggestions = document.getElementById('suggestions');
        var debounceTimer = null;

        input.addEventListener('input', function () {
            var q = input.value.trim();
            clearTimeout(debounceTimer);
            if (q.length < 2) {
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                return;
            }
            debounceTimer = setTimeout(function () { searchActivities(q); }, 300);
        });

        input.addEventListener('blur', function () {
            setTimeout(function () { suggestions.style.display = 'none'; }, 200);
        });

        document.getElementById('clearActivityBtn').addEventListener('click', function () {
            state.selectedActivity = null;
            document.getElementById('selectedActivityBox').classList.add('hidden');
            document.getElementById('activitySelector').classList.remove('hidden');
            input.value = '';
            updateLogButtonState();
        });
    }

    function searchActivities(q) {
        fetch(API_BASE + '/api/v1/outlook/activities?q=' + encodeURIComponent(q), {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + state.token }
        }).then(function (res) {
            if (!res.ok) throw new Error('Search failed (' + res.status + ')');
            return res.json();
        }).then(function (list) {
            renderSuggestions(list || []);
        }).catch(function (err) {
            console.error(err);
        });
    }

    function renderSuggestions(list) {
        var box = document.getElementById('suggestions');
        box.innerHTML = '';
        if (list.length === 0) {
            box.innerHTML = '<div class="suggestion-item text-muted">No matching activities.</div>';
            box.style.display = 'block';
            return;
        }
        list.forEach(function (a) {
            var item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = a.label;
            item.addEventListener('mousedown', function (e) {
                e.preventDefault();
                selectActivity(a);
            });
            box.appendChild(item);
        });
        box.style.display = 'block';
    }

    function selectActivity(a) {
        state.selectedActivity = a;
        document.getElementById('suggestions').style.display = 'none';
        document.getElementById('activitySelector').classList.add('hidden');
        document.getElementById('selectedActivityBox').classList.remove('hidden');
        document.getElementById('selectedActivityLabel').textContent = a.label;
        updateLogButtonState();
    }

    function updateLogButtonState() {
        document.getElementById('logBtn').disabled = !state.selectedActivity;
    }

    // --- Log button (Tab 1) ---
    function wireLogButton() {
        document.getElementById('logBtn').addEventListener('click', logEmail);
    }

    function logEmail() {
        if (!state.selectedActivity) return;
        var btn = document.getElementById('logBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span> Logging…';

        var item = Office.context.mailbox.item;
        var form = new FormData();
        form.append('activityId', state.selectedActivity.activityId);
        form.append('statusId', document.querySelector('input[name="statusRadio"]:checked').value);
        form.append('subject', item.subject || '');
        form.append('body', state.emailBodyText || '');
        form.append('senderName', item.from ? (item.from.displayName || '') : '');
        form.append('senderEmail', item.from ? (item.from.emailAddress || '') : '');
        form.append('receivedDate', item.dateTimeCreated ? new Date(item.dateTimeCreated).toISOString() : '');

        var selectedAtts = state.attachmentMeta.filter(function (a) { return a.selected; });
        var total = selectedAtts.length;
        form.append('attachmentCount', total);

        if (total === 0) {
            submitLogForm(form);
            return;
        }

        var fetched = 0;
        selectedAtts.forEach(function (att, idx) {
            item.getAttachmentContentAsync(att.id, function (result) {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    var content = result.value.content;
                    var format = result.value.format;
                    var blob;
                    if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                        blob = base64ToBlob(content);
                    } else {
                        blob = new Blob([content], { type: 'text/plain' });
                    }
                    form.append('file_' + idx, blob, att.name);
                    form.append('fileName_' + idx, att.name);
                } else {
                    console.warn('Failed to fetch attachment ' + att.name);
                    form.append('fileName_' + idx, att.name);
                }
                fetched++;
                if (fetched === total) submitLogForm(form);
            });
        });
    }

    function submitLogForm(form) {
        fetch(API_BASE + '/api/v1/outlook/log-email', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + state.token },
            body: form
        }).then(function (res) {
            return res.json().then(function (data) {
                return { status: res.status, data: data };
            });
        }).then(function (wrapped) {
            var btn = document.getElementById('logBtn');
            btn.innerHTML = 'Log Email';
            if (wrapped.status === 200 && wrapped.data.success) {
                showResult('logResultAlert', 'success',
                    'Email logged to activity. (' + wrapped.data.attachmentsUploaded +
                    ' attachment' + (wrapped.data.attachmentsUploaded === 1 ? '' : 's') + ' uploaded)');
                btn.disabled = true;
            } else {
                showResult('logResultAlert', 'danger', wrapped.data.error || 'Failed to log email.');
                btn.disabled = false;
            }
        }).catch(function (err) {
            var btn = document.getElementById('logBtn');
            btn.innerHTML = 'Log Email';
            btn.disabled = false;
            showResult('logResultAlert', 'danger', 'Network error: ' + err.message);
        });
    }

    // --- Ticket form (Tab 2) ---
    function wireTicketForm() {
        loadTicketCategories();
        populatePrimaryContactDropdown();

        var select = document.getElementById('serviceItemSelect');
        var customWrap = document.getElementById('customReasonWrap');
        var customInput = document.getElementById('customReasonInput');

        select.addEventListener('change', function () {
            if (select.value === '0') {
                customWrap.classList.remove('hidden');
                customInput.focus();
            } else {
                customWrap.classList.add('hidden');
                customInput.value = '';
            }
            updateTicketButtonState();
        });

        document.getElementById('primaryContactSelect').addEventListener('change', function () {
            renderAdditionalContacts();
            updateTicketButtonState();
        });

        customInput.addEventListener('input', updateTicketButtonState);
        document.getElementById('ticketDescription').addEventListener('input', updateTicketButtonState);
        document.getElementById('createTicketBtn').addEventListener('click', createTicket);
    }

    function populatePrimaryContactDropdown() {
        var sel = document.getElementById('primaryContactSelect');
        sel.innerHTML = '';
        if (state.emailPeople.length === 0) {
            sel.innerHTML = '<option value="" disabled selected>No contacts found</option>';
            return;
        }
        state.emailPeople.forEach(function (p, idx) {
            var opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = p.label;
            sel.appendChild(opt);
        });
        // Default to first (the From sender)
        sel.value = '0';
        renderAdditionalContacts();
    }

    function renderAdditionalContacts() {
        var primaryIdx = parseInt(document.getElementById('primaryContactSelect').value, 10);
        var section = document.getElementById('additionalContactsSection');
        var listEl = document.getElementById('additionalContactsList');
        listEl.innerHTML = '';

        var others = [];
        state.emailPeople.forEach(function (p, idx) {
            if (idx !== primaryIdx) others.push({ person: p, idx: idx });
        });

        if (others.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = '';
        others.forEach(function (o) {
            var row = document.createElement('div');
            row.className = 'form-check';
            var cbId = 'addlContact_' + o.idx;
            row.innerHTML = '<input class="form-check-input addl-contact-cb" type="checkbox" id="' + cbId +
                '" value="' + o.idx + '" checked/>' +
                '<label class="form-check-label" for="' + cbId + '">' +
                escapeHtml(o.person.label) + '</label>';
            listEl.appendChild(row);
        });
    }

    function loadTicketCategories() {
        fetch(API_BASE + '/api/v1/outlook/ticket-categories', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + state.token }
        }).then(function (res) {
            if (!res.ok) throw new Error('Failed to load categories (' + res.status + ')');
            return res.json();
        }).then(function (items) {
            state.ticketCategories = items || [];
            renderTicketDropdown(state.ticketCategories);
        }).catch(function (err) {
            console.error(err);
            var sel = document.getElementById('serviceItemSelect');
            sel.innerHTML = '<option value="" disabled selected>Failed to load</option>';
        });
    }

    function renderTicketDropdown(items) {
        var sel = document.getElementById('serviceItemSelect');
        sel.innerHTML = '<option value="" disabled selected>Select a reason…</option>';

        // Group by category
        var groups = {};
        var groupOrder = [];
        items.forEach(function (it) {
            if (!groups[it.category]) {
                groups[it.category] = [];
                groupOrder.push(it.category);
            }
            groups[it.category].push(it);
        });

        groupOrder.forEach(function (cat) {
            var optgroup = document.createElement('optgroup');
            optgroup.label = cat;
            groups[cat].forEach(function (it) {
                var opt = document.createElement('option');
                opt.value = it.id;
                opt.textContent = it.description;
                optgroup.appendChild(opt);
            });
            sel.appendChild(optgroup);
        });

        // "Enter my own reason" option
        var customOpt = document.createElement('option');
        customOpt.value = '0';
        customOpt.textContent = '— Enter my own reason —';
        sel.appendChild(customOpt);
    }

    function updateTicketButtonState() {
        var sel = document.getElementById('serviceItemSelect');
        var desc = document.getElementById('ticketDescription').value.trim();
        var valid = desc.length > 0 && sel.value !== '';

        if (sel.value === '0') {
            valid = valid && document.getElementById('customReasonInput').value.trim().length > 0;
        }

        document.getElementById('createTicketBtn').disabled = !valid;
    }

    function createTicket() {
        var btn = document.getElementById('createTicketBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span> Creating…';

        var item = Office.context.mailbox.item;
        var sel = document.getElementById('serviceItemSelect');

        var form = new FormData();
        form.append('serviceItemId', sel.value);
        if (sel.value === '0') {
            form.append('customReason', document.getElementById('customReasonInput').value.trim());
        }
        form.append('description', document.getElementById('ticketDescription').value.trim());
        form.append('subject', item.subject || '');
        form.append('body', state.emailBodyText || '');
        form.append('senderName', item.from ? (item.from.displayName || '') : '');
        form.append('senderEmail', item.from ? (item.from.emailAddress || '') : '');
        form.append('receivedDate', item.dateTimeCreated ? new Date(item.dateTimeCreated).toISOString() : '');

        // Primary contact from dropdown
        var primaryIdx = parseInt(document.getElementById('primaryContactSelect').value, 10);
        var primary = state.emailPeople[primaryIdx];
        form.append('primaryContactEmail', primary.email);
        form.append('primaryContactName', primary.name);

        // Additional contacts from checked boxes
        var additionalContacts = [];
        document.querySelectorAll('.addl-contact-cb:checked').forEach(function (cb) {
            var idx = parseInt(cb.value, 10);
            var p = state.emailPeople[idx];
            additionalContacts.push({ email: p.email, name: p.name });
        });
        form.append('additionalContacts', JSON.stringify(additionalContacts));

        var selectedAtts = state.attachmentMeta.filter(function (a) { return a.selected; });
        var total = selectedAtts.length;
        form.append('attachmentCount', total);

        if (total === 0) {
            submitTicketForm(form);
            return;
        }

        var fetched = 0;
        selectedAtts.forEach(function (att, idx) {
            item.getAttachmentContentAsync(att.id, function (result) {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    var content = result.value.content;
                    var format = result.value.format;
                    var blob;
                    if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                        blob = base64ToBlob(content);
                    } else {
                        blob = new Blob([content], { type: 'text/plain' });
                    }
                    form.append('file_' + idx, blob, att.name);
                    form.append('fileName_' + idx, att.name);
                } else {
                    console.warn('Failed to fetch attachment ' + att.name);
                    form.append('fileName_' + idx, att.name);
                }
                fetched++;
                if (fetched === total) submitTicketForm(form);
            });
        });
    }

    function submitTicketForm(form) {
        fetch(API_BASE + '/api/v1/outlook/create-ticket', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + state.token },
            body: form
        }).then(function (res) {
            return res.json().then(function (data) {
                return { status: res.status, data: data };
            });
        }).then(function (wrapped) {
            var btn = document.getElementById('createTicketBtn');
            btn.innerHTML = 'Create Ticket';
            if (wrapped.status === 200 && wrapped.data.success) {
                showResult('ticketResultAlert', 'success',
                    'Ticket created (ID ' + wrapped.data.activityId + '). ' +
                    wrapped.data.attachmentsUploaded + ' attachment' +
                    (wrapped.data.attachmentsUploaded === 1 ? '' : 's') + ' uploaded.');
                btn.disabled = true;
            } else {
                showResult('ticketResultAlert', 'danger', wrapped.data.error || 'Failed to create ticket.');
                btn.disabled = false;
            }
        }).catch(function (err) {
            var btn = document.getElementById('createTicketBtn');
            btn.innerHTML = 'Create Ticket';
            btn.disabled = false;
            showResult('ticketResultAlert', 'danger', 'Network error: ' + err.message);
        });
    }

    // --- Shared helpers ---
    function showResult(elementId, type, msg) {
        var el = document.getElementById(elementId);
        el.className = 'alert alert-' + type + ' mt-2';
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function formatBytes(n) {
        if (!n || n < 1024) return (n || 0) + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    function base64ToBlob(b64) {
        var bin = atob(b64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr]);
    }
})();
</script>
