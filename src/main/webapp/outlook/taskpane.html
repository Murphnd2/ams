<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log to AMS</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --ams-primary: #0d5681;
            --ams-accent:  #87a948;
            --ams-bg:      #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 12px;
            background: var(--ams-bg);
            color: #212529;
        }
        .ams-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--ams-primary);
            margin-bottom: 12px;
        }
        .ams-header .logo-dot {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: var(--ams-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
        }
        .ams-header h5 { margin: 0; color: var(--ams-primary); font-weight: 600; }
        .section { margin-bottom: 14px; }
        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .email-preview {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
        }
        .email-preview .field { margin-bottom: 3px; }
        .email-preview .label { color: #6c757d; display: inline-block; width: 58px; }
        .attachments-list { margin-top: 6px; }
        .attachments-list .att {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 3px 0;
        }
        .attachments-list .att input { margin: 0; }
        #activitySearch { font-size: 13px; }
        .suggestions {
            position: relative;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 6px 6px;
            background: #fff;
            display: none;
        }
        .suggestion-item {
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f5;
        }
        .suggestion-item:hover { background: #e9f3fb; }
        .suggestion-item:last-child { border-bottom: none; }
        .selected-activity {
            background: var(--ams-primary);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selected-activity .clear-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 4px;
        }
        .btn-ams {
            background: var(--ams-accent);
            border: none;
            color: #fff;
            font-weight: 600;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-ams:hover { background: #6f9139; color: #fff; }
        .btn-ams:disabled { background: #adb5bd; cursor: not-allowed; }
        .form-check-label { font-size: 12px; }
        .alert { font-size: 12px; padding: 8px 10px; }
        .hidden { display: none !important; }
        .spinner-sm {
            width: 14px; height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="ams-header">
    <div class="logo-dot">A</div>
    <h5>Log to AMS</h5>
</div>

<div id="loadingState" class="text-center text-muted py-4">
    <div class="spinner-border spinner-border-sm" role="status"></div>
    <div class="mt-2" style="font-size: 12px;">Connecting to AMS…</div>
</div>

<div id="notLinkedState" class="hidden">
    <div class="alert alert-warning">
        <strong>Account not linked.</strong><br>
        Your Microsoft 365 account is not linked to AMS. Please contact your administrator to set up access.
    </div>
    <div class="text-muted" style="font-size: 11px;">
        <span id="userEmailDisplay"></span>
    </div>
</div>

<div id="mainUi" class="hidden">

    <div class="section">
        <div class="section-label">Email</div>
        <div class="email-preview">
            <div class="field"><span class="label">From:</span> <span id="emailFrom"></span></div>
            <div class="field"><span class="label">Subject:</span> <span id="emailSubject"></span></div>
            <div class="field"><span class="label">Date:</span> <span id="emailDate"></span></div>
            <div id="attachmentsSection" class="hidden">
                <div class="label" style="margin-top: 6px;">Attachments:</div>
                <div class="attachments-list" id="attachmentsList"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-label">Activity</div>
        <div id="activitySelector">
            <input type="text" class="form-control" id="activitySearch"
                   placeholder="Search by employer or activity…" autocomplete="off"/>
            <div class="suggestions" id="suggestions"></div>
        </div>
        <div id="selectedActivityBox" class="selected-activity hidden">
            <span id="selectedActivityLabel"></span>
            <button type="button" class="clear-btn" id="clearActivityBtn" title="Clear">&times;</button>
        </div>
    </div>

    <div class="section">
        <div class="section-label">Status after logging</div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="statusRadio" id="statusWaitOnUs" value="3" checked/>
            <label class="form-check-label" for="statusWaitOnUs">Waiting on Us</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="statusRadio" id="statusWaitOnThem" value="1"/>
            <label class="form-check-label" for="statusWaitOnThem">Waiting on Them</label>
        </div>
    </div>

    <button type="button" class="btn-ams" id="logBtn" disabled>Log Email</button>

    <div id="resultAlert" class="alert hidden mt-2"></div>

    <div class="text-muted mt-3" style="font-size: 10px;">
        Signed in as <span id="signedInAs"></span>
    </div>
</div>

<script>
(function () {
    'use strict';

    var API_BASE = 'https://superiorstate.biz';
    var TOKEN_KEY = 'ams_outlook_token';
    var STORED_EMAIL_KEY = 'ams_outlook_email';

    var state = {
        token: null,
        userName: null,
        personId: null,
        mailboxEmail: null,
        selectedActivity: null,
        emailBodyText: '',
        attachmentMeta: []  // [{id, name, size, selected}]
    };

    // --- Office.js bootstrap ---
    Office.onReady(function (info) {
        if (info.host !== Office.HostType.Outlook) {
            showError('This add-in only works in Outlook.');
            return;
        }
        try {
            state.mailboxEmail = Office.context.mailbox.userProfile.emailAddress;
            authenticate();
        } catch (e) {
            showError('Unable to read Outlook profile: ' + e.message);
        }
    });

    // --- Authentication flow ---
    function authenticate() {
        var storedToken = localStorage.getItem(TOKEN_KEY);
        var storedEmail = localStorage.getItem(STORED_EMAIL_KEY);

        // If we have a cached token for the same M365 email, validate it lazily.
        if (storedToken && storedEmail === state.mailboxEmail) {
            state.token = storedToken;
            validateStoredToken(function (ok) {
                if (ok) {
                    // Token is good — fetch profile via activities ping, user name
                    // will come back from subsequent authenticate if needed.
                    // We need userName for display, so re-authenticate once.
                    exchangeEmailForToken();
                } else {
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem(STORED_EMAIL_KEY);
                    state.token = null;
                    exchangeEmailForToken();
                }
            });
        } else {
            exchangeEmailForToken();
        }
    }

    function validateStoredToken(cb) {
        fetch(API_BASE + '/api/v1/outlook/activities?q=__ping__', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + state.token }
        }).then(function (res) {
            cb(res.status !== 401);
        }).catch(function () {
            cb(false);
        });
    }

    function exchangeEmailForToken() {
        fetch(API_BASE + '/api/v1/outlook/authenticate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ m365Email: state.mailboxEmail })
        }).then(function (res) {
            if (res.status === 404) {
                showNotLinked();
                return null;
            }
            if (!res.ok) {
                throw new Error('Authentication failed (' + res.status + ')');
            }
            return res.json();
        }).then(function (data) {
            if (!data) return;
            state.token = data.token;
            state.userName = data.userName;
            state.personId = data.personId;
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(STORED_EMAIL_KEY, state.mailboxEmail);
            showMainUi();
        }).catch(function (err) {
            showError(err.message);
        });
    }

    // --- UI state transitions ---
    function showNotLinked() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('notLinkedState').classList.remove('hidden');
        document.getElementById('userEmailDisplay').textContent = state.mailboxEmail;
    }

    function showError(msg) {
        document.getElementById('loadingState').innerHTML =
            '<div class="alert alert-danger">' + escapeHtml(msg) + '</div>';
    }

    function showMainUi() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('mainUi').classList.remove('hidden');
        document.getElementById('signedInAs').textContent = state.userName || state.mailboxEmail;
        populateEmailPreview();
        wireActivitySearch();
        wireLogButton();
    }

    // --- Email preview ---
    function populateEmailPreview() {
        var item = Office.context.mailbox.item;
        if (!item) return;

        var fromName = item.from ? (item.from.displayName || '') : '';
        var fromEmail = item.from ? (item.from.emailAddress || '') : '';
        document.getElementById('emailFrom').textContent =
            fromName + (fromEmail ? ' <' + fromEmail + '>' : '');
        document.getElementById('emailSubject').textContent = item.subject || '(no subject)';
        document.getElementById('emailDate').textContent =
            item.dateTimeCreated ? new Date(item.dateTimeCreated).toLocaleString() : '';

        // Attachments
        var atts = item.attachments || [];
        state.attachmentMeta = [];
        if (atts.length > 0) {
            var listEl = document.getElementById('attachmentsList');
            listEl.innerHTML = '';
            atts.forEach(function (att, idx) {
                // Skip inline attachments (embedded images etc.)
                if (att.isInline) return;
                state.attachmentMeta.push({
                    id: att.id,
                    name: att.name,
                    size: att.size,
                    selected: true
                });
                var row = document.createElement('div');
                row.className = 'att';
                var cbId = 'att_' + idx;
                row.innerHTML = '<input type="checkbox" id="' + cbId + '" checked data-idx="' +
                    (state.attachmentMeta.length - 1) + '"/> ' +
                    '<label for="' + cbId + '" style="cursor:pointer;">' +
                    escapeHtml(att.name) + ' <span class="text-muted">(' +
                    formatBytes(att.size) + ')</span></label>';
                listEl.appendChild(row);
            });
            if (state.attachmentMeta.length > 0) {
                document.getElementById('attachmentsSection').classList.remove('hidden');
                listEl.addEventListener('change', function (e) {
                    if (e.target && e.target.dataset && e.target.dataset.idx) {
                        var i = parseInt(e.target.dataset.idx, 10);
                        state.attachmentMeta[i].selected = e.target.checked;
                    }
                });
            }
        }

        // Body (async)
        item.body.getAsync(Office.CoercionType.Text, function (result) {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
                state.emailBodyText = result.value || '';
            }
        });
    }

    // --- Activity autocomplete ---
    function wireActivitySearch() {
        var input = document.getElementById('activitySearch');
        var suggestions = document.getElementById('suggestions');
        var debounceTimer = null;

        input.addEventListener('input', function () {
            var q = input.value.trim();
            clearTimeout(debounceTimer);
            if (q.length < 2) {
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                return;
            }
            debounceTimer = setTimeout(function () { searchActivities(q); }, 300);
        });

        input.addEventListener('blur', function () {
            setTimeout(function () { suggestions.style.display = 'none'; }, 200);
        });

        document.getElementById('clearActivityBtn').addEventListener('click', function () {
            state.selectedActivity = null;
            document.getElementById('selectedActivityBox').classList.add('hidden');
            document.getElementById('activitySelector').classList.remove('hidden');
            input.value = '';
            updateLogButtonState();
        });
    }

    function searchActivities(q) {
        fetch(API_BASE + '/api/v1/outlook/activities?q=' + encodeURIComponent(q), {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + state.token }
        }).then(function (res) {
            if (!res.ok) throw new Error('Search failed (' + res.status + ')');
            return res.json();
        }).then(function (list) {
            renderSuggestions(list || []);
        }).catch(function (err) {
            console.error(err);
        });
    }

    function renderSuggestions(list) {
        var box = document.getElementById('suggestions');
        box.innerHTML = '';
        if (list.length === 0) {
            box.innerHTML = '<div class="suggestion-item text-muted">No matching activities.</div>';
            box.style.display = 'block';
            return;
        }
        list.forEach(function (a) {
            var item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = a.label;
            item.addEventListener('mousedown', function (e) {
                e.preventDefault();
                selectActivity(a);
            });
            box.appendChild(item);
        });
        box.style.display = 'block';
    }

    function selectActivity(a) {
        state.selectedActivity = a;
        document.getElementById('suggestions').style.display = 'none';
        document.getElementById('activitySelector').classList.add('hidden');
        document.getElementById('selectedActivityBox').classList.remove('hidden');
        document.getElementById('selectedActivityLabel').textContent = a.label;
        updateLogButtonState();
    }

    function updateLogButtonState() {
        document.getElementById('logBtn').disabled = !state.selectedActivity;
    }

    // --- Log button ---
    function wireLogButton() {
        document.getElementById('logBtn').addEventListener('click', logEmail);
    }

    function logEmail() {
        if (!state.selectedActivity) return;
        var btn = document.getElementById('logBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span> Logging…';

        var item = Office.context.mailbox.item;
        var form = new FormData();
        form.append('activityId', state.selectedActivity.activityId);
        form.append('statusId', document.querySelector('input[name="statusRadio"]:checked').value);
        form.append('subject', item.subject || '');
        form.append('body', state.emailBodyText || '');
        form.append('senderName', item.from ? (item.from.displayName || '') : '');
        form.append('senderEmail', item.from ? (item.from.emailAddress || '') : '');
        form.append('receivedDate', item.dateTimeCreated ? new Date(item.dateTimeCreated).toISOString() : '');

        var selectedAtts = state.attachmentMeta.filter(function (a) { return a.selected; });
        var total = selectedAtts.length;
        form.append('attachmentCount', total);

        if (total === 0) {
            submitFormData(form);
            return;
        }

        // Fetch attachment content sequentially, then submit.
        var fetched = 0;
        selectedAtts.forEach(function (att, idx) {
            item.getAttachmentContentAsync(att.id, function (result) {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    var content = result.value.content;
                    var format = result.value.format;
                    var blob;
                    if (format === Office.MailboxEnums.AttachmentContentFormat.Base64) {
                        blob = base64ToBlob(content);
                    } else {
                        // EML or iCal — treat as text
                        blob = new Blob([content], { type: 'text/plain' });
                    }
                    form.append('file_' + idx, blob, att.name);
                    form.append('fileName_' + idx, att.name);
                } else {
                    console.warn('Failed to fetch attachment ' + att.name);
                    form.append('fileName_' + idx, att.name);
                }
                fetched++;
                if (fetched === total) submitFormData(form);
            });
        });
    }

    function submitFormData(form) {
        fetch(API_BASE + '/api/v1/outlook/log-email', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + state.token },
            body: form
        }).then(function (res) {
            return res.json().then(function (data) {
                return { status: res.status, data: data };
            });
        }).then(function (wrapped) {
            var btn = document.getElementById('logBtn');
            btn.innerHTML = 'Log Email';
            if (wrapped.status === 200 && wrapped.data.success) {
                showResult('success',
                    'Email logged to activity. (' + wrapped.data.attachmentsUploaded +
                    ' attachment' + (wrapped.data.attachmentsUploaded === 1 ? '' : 's') + ' uploaded)');
                btn.disabled = true;
            } else {
                showResult('danger', wrapped.data.error || 'Failed to log email.');
                btn.disabled = false;
            }
        }).catch(function (err) {
            var btn = document.getElementById('logBtn');
            btn.innerHTML = 'Log Email';
            btn.disabled = false;
            showResult('danger', 'Network error: ' + err.message);
        });
    }

    function showResult(type, msg) {
        var el = document.getElementById('resultAlert');
        el.className = 'alert alert-' + type + ' mt-2';
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    // --- Utilities ---
    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function formatBytes(n) {
        if (!n || n < 1024) return (n || 0) + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    function base64ToBlob(b64) {
        var bin = atob(b64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr]);
    }
})();
</script>
</body>
</html>
